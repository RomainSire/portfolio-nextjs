name: Build, push & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/romainsire/portfolio-nextjs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /opt/docker/portfolio

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u RomainSire --password-stdin

            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
            echo "✅ Déploiement terminé!"

      - name: Healthcheck
        run: |
          sleep 30
          for i in {1..3}; do
            echo "Tentative $i/3..."
            if curl -f --max-time 10 https://romainsire.com; then
              echo "✅ Site accessible!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Site inaccessible"
          exit 1
